<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>La Maison d'Obhur</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Dancing+Script:wght@500&display=swap">
<style>
/* Measured from lamaison.com.sa: sand page #E6DFD8, brown welcome band #3A2A2A, aqua events band #46C1CD, square corners, uppercase aqua CTA, aqua script eyebrows. Section order mirrors their homepage. Single light theme by design. */
:root{
  --sand:#E6DFD8; --white:#FFFFFF; --aqua:#46C1CD; --aqua-dark:#358E97; --teal:#123336; --brown:#3A2A2A; --brown-2:#563F3E; --grey:#4F6263; --aqua-text:#1E6A73; --line:#D9D0C7; --ok:#2E8B57; --wa:#1FA855;
  --font:"Open Sans","Myriad Pro",Arial,sans-serif; --font-ar:"Cairo","Frutiger LT Arabic",Arial,sans-serif; --script:"Dancing Script","Amalfi Coast",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--teal);font-family:var(--font);line-height:1.65;direction:rtl}
body[lang="ar"]{font-family:var(--font-ar)} body[lang="en"]{direction:ltr}
h1,h2,h3{font-family:inherit;font-weight:500;color:var(--brown);margin:0;text-wrap:balance}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:2rem} .band .wrap{padding-block:0}
.band.brown{background:var(--brown);color:#fff} .band.brown h2,.band.brown h1{color:#fff}
.band.aqua{background:var(--aqua);color:var(--teal)} .band.aqua h2{color:var(--teal)}
.script{font-family:var(--script);color:var(--aqua-text);font-size:1.35rem;display:block;margin-bottom:.1rem;font-weight:500}
.band.brown .script{color:var(--aqua)}
body[lang="ar"] .script{font-family:var(--font-ar);font-size:1rem;font-weight:600;letter-spacing:0}
.band.aqua .script{color:var(--teal)}
.h2{font-size:1.9rem;line-height:1.2}
.card{background:var(--white);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 1.2rem;font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:0;font-family:inherit;text-decoration:none;color:var(--teal);background:var(--aqua);box-sizing:border-box}
body[lang="ar"] .btn{letter-spacing:0;text-transform:none;font-size:1rem}
.btn:active{background:var(--aqua-dark);color:#fff} .btn.brown{background:var(--brown);color:#fff} .btn.outline{background:transparent;border:1px solid var(--teal);color:var(--teal)} .btn.wa{background:var(--wa);color:#fff}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--aqua-dark);outline-offset:2px}
.tab{padding:.45rem .95rem;border:1px solid var(--line);background:var(--white);color:var(--grey);cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:600}
.tab[aria-selected="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--aqua)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.fac{background:var(--white);border:1px solid var(--line)} .fac .ph{aspect-ratio:1/1}
.fac .t{padding:.6rem .8rem;font-weight:600;color:var(--brown)} #fac .fac:last-child:nth-child(odd){grid-column:1/-1} #fac .fac:last-child:nth-child(odd) .ph{aspect-ratio:16/9} .fac .m{padding:0 .8rem .7rem;font-size:.78rem;color:var(--grey);letter-spacing:.08em;text-transform:uppercase}
body[lang="ar"] .fac .m{letter-spacing:0;text-transform:none}
.hero{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--aqua)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
input,select,textarea{width:100%;background:var(--white);color:var(--teal);border:1px solid var(--line);padding:.65rem .8rem;font-family:inherit;font-size:1rem;box-sizing:border-box}
label{font-size:.85rem;color:var(--brown-2);display:block;margin-bottom:.3rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);overflow:hidden;background:var(--white)}
.qty button{width:40px;height:40px;border:0;background:var(--sand);color:var(--teal);font-size:1.2rem;cursor:pointer;font-family:inherit}
.qty span{min-width:36px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.day{aspect-ratio:auto;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;font-variant-numeric:tabular-nums;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--teal);font-family:inherit;line-height:1.1;padding:0}
.day small{font-size:.7rem;color:var(--grey)}
.day.open{background:var(--sand);border-color:var(--line)} .day.full{opacity:1;color:var(--grey);cursor:not-allowed} .day.full>span{text-decoration:line-through} .day.closed{color:var(--grey);cursor:not-allowed}
.day.sel{background:var(--aqua);color:var(--teal);border-color:var(--aqua)} .day.sel small{color:var(--teal)}
.tier{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border:1px solid var(--line);background:var(--white);cursor:pointer;margin-top:.4rem}
.tier input{width:auto;accent-color:var(--aqua-dark)} .tier.on{border-color:var(--aqua-dark);background:#E3F5F7}
.tier .tn{font-weight:600;color:var(--brown)} .tier .td{font-size:.78rem;color:var(--grey)} .tier .tp{margin-inline-start:auto;font-weight:700;white-space:nowrap}
.addon{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--line)} .addon input{width:auto;accent-color:var(--aqua-dark)}
.step{display:none} .step.on{display:block}
.pay{display:flex;gap:.5rem;flex-wrap:wrap} .pay button{flex:1;min-width:30%;padding:.7rem;border:1px solid var(--line);background:var(--white);color:var(--teal);font-weight:600;cursor:pointer;font-family:inherit}
.pay button[aria-pressed="true"]{border-color:var(--aqua-dark);background:#E3F5F7}
.ticket{border:1px dashed var(--aqua-dark);padding:1rem;background:#E3F5F7}
.qr{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:90px;aspect-ratio:1} .qr i{background:var(--teal)} .qr i.o{background:transparent}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--brown)}
details summary::after{content:"+";color:var(--grey);font-size:1.3rem} details[open] summary::after{content:"−"}
.sticky{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--white);border-top:1px solid var(--line);padding:.6rem max(16px,env(safe-area-inset-right,0px)) calc(.6rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;padding:.5rem 1rem;font-size:.9rem;z-index:30}
.langbtn{border:1px solid var(--line);background:var(--white);color:var(--teal);padding:.3rem .8rem;font-family:inherit;font-weight:600;cursor:pointer}
.note{font-size:.8rem;color:var(--grey)}
.footer{background:var(--sand);color:var(--brown-2);padding:1.5rem 0 calc(7.5rem + env(safe-area-inset-bottom,0px));font-size:.85rem;border-top:1px solid var(--line)}
.footer a{color:var(--brown-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* review fixes: tap targets, qty direction, toast role, error state, preview badge */
.qty{direction:ltr} .qty button{width:44px;height:44px}
.tab,.langbtn{min-height:44px}
.err{color:#B3261E;font-size:.8rem;margin-top:.3rem}
input[aria-invalid="true"],select[aria-invalid="true"]{outline:2px solid #B3261E;outline-offset:1px}
.preview-badge{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);z-index:40;border-radius:0 0 6px 6px;background:#B3261E;color:#fff;font-size:.65rem;letter-spacing:.08em;padding:.2rem .5rem;font-weight:700;opacity:.85}
</style>

<!-- WELCOME BAND (brown, white text, aqua script) -->
<div class="band brown"><div class="wrap">
  <span class="script" data-i="script"></span>
  <h1 class="h2" data-i="h1"></h1>
  <p style="margin:.8rem 0 0;opacity:.92" data-i="lead"></p>
  <div style="display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;margin-top:1rem;font-size:.85rem;opacity:.85"><span data-i="pillLadies"></span><span data-i="pillHrs"></span></div>
  <div class="row" style="margin-top:1.2rem"><div><div class="note" style="color:rgba(255,255,255,.75)" data-i="fromLbl"></div><div class="num" style="font-size:1.5rem;font-weight:700;color:#fff" id="heroPrice"></div></div><a href="#book" class="btn" style="min-width:48%" data-i="barCta"></a></div>
</div></div>

<!-- BOOKING (sand, white card like their facility cards) -->
<div class="band" id="book"><div class="wrap">
  <span class="script" data-i="scriptBook"></span>
  <h2 class="h2" data-i="bookH"></h2>
  <p class="note" style="margin:.4rem 0 0;color:var(--brown-2)" data-i="bookLead"></p>
  <div class="card" style="padding:1rem;margin-top:1rem">
    <div class="step on" id="s1">
      <div class="row"><button class="tab" id="prevM" onclick="shiftMonth(-1)">‹</button><div style="font-weight:600;color:var(--brown)" id="monthLabel"></div><button class="tab" id="nextM" onclick="shiftMonth(1)">›</button></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem;font-size:.72rem;color:var(--grey);text-align:center;margin-top:.6rem" id="dow"></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;margin-top:.2rem" id="cal"></div>
      <div style="display:flex;gap:.8rem;font-size:.75rem;color:var(--grey);margin-top:.5rem;flex-wrap:wrap"><span><i style="display:inline-block;width:10px;height:10px;background:var(--sand);border:1px solid var(--line);vertical-align:middle"></i> <span data-i="lgOpen"></span></span><span style="text-decoration:line-through" data-i="lgFull"></span><span style="color:var(--aqua-dark);font-weight:700" data-i="lgSel"></span></div>
      <div id="capLine" style="font-size:.85rem;margin-top:.6rem;font-weight:600"></div>

      <div style="font-weight:600;color:var(--brown);margin-top:1rem" data-i="tierH"></div>
      <div class="note" style="margin-bottom:.4rem" data-i="tierNote"></div>
      <fieldset id="tiers" style="border:0;padding:0;margin:0"></fieldset>
      <div class="row" style="margin-top:.9rem"><div><div style="font-weight:600;color:var(--brown)" data-i="qAdult"></div><div class="note" id="tierPriceLine"></div></div><div class="qty"><button onclick="q('a',-1)">−</button><span id="qa">1</span><button onclick="q('a',1)">+</button></div></div>
      <div class="row" style="margin-top:.6rem"><div><div style="font-weight:600;color:var(--brown)" data-i="qChild"></div><div class="note" data-i="childNote"></div></div><div class="qty"><button onclick="q('c',-1)">−</button><span id="qc">0</span><button onclick="q('c',1)">+</button></div></div>
      <div style="font-weight:600;color:var(--brown);margin-top:1rem" data-i="addH"></div>
      <div id="addons"></div>
      <div style="background:var(--sand);padding:.8rem;margin-top:.9rem;font-size:.9rem"><div class="row"><span data-i="sumLbl"></span><strong class="num" id="total">—</strong></div><div id="sumDetail" class="note" style="margin-top:.2rem"></div></div>
      <button class="btn" style="width:100%;margin-top:.9rem" onclick="go(2)" data-i="toPay"></button>
    </div>
    <div class="step" id="s2">
      <div style="font-weight:600;color:var(--brown);margin-bottom:.5rem" data-i="payH"></div>
      <label for="pName" data-i="lName"></label><input id="pName" autocomplete="name">
      <label for="pPhone" style="margin-top:.6rem" data-i="lPhone"></label><input id="pPhone" type="tel" dir="ltr" inputmode="tel" required placeholder="05xxxxxxxx" autocomplete="tel">
      <div class="note" style="margin:.8rem 0 .4rem" data-i="payMethod"></div>
      <div class="pay" id="payBtns"><button aria-pressed="true" onclick="pm(this)">Apple Pay</button><button aria-pressed="false" onclick="pm(this)">mada</button><button aria-pressed="false" onclick="pm(this)">Visa / Mastercard</button></div>
      <label style="display:flex;gap:.5rem;align-items:flex-start;margin-top:.9rem;font-size:.85rem;color:var(--teal)"><input type="checkbox" id="agree" style="width:auto;margin-top:.3rem;accent-color:var(--aqua-dark)"><span data-i="agree"></span></label>
      <div class="row" style="margin-top:.9rem;font-weight:600"><span data-i="sumLbl2"></span><span class="num" id="total2">—</span></div>
      <button class="btn" style="width:100%;margin-top:.9rem" onclick="pay()" data-i="payNow"></button>
      <button class="btn outline" style="width:100%;margin-top:.5rem" onclick="go(1)" data-i="back"></button>
      <div class="note" style="margin-top:.6rem" data-i="demoNote" hidden></div>
    </div>
    <div class="step" id="s3">
      <div class="ticket"><div class="row"><div><div style="font-weight:700;color:var(--brown)" data-i="tkTitle"></div><div class="note" id="tkMeta"></div><div class="num" style="font-weight:700;margin-top:.3rem" id="tkCode"></div></div><div class="qr" id="qr" aria-hidden="true"></div></div><div style="font-size:.8rem;margin-top:.6rem" data-i="tkNote"></div></div>
      <button class="btn outline" style="width:100%;margin-top:.8rem" onclick="go(1)" data-i="again"></button>
    </div>
  </div>
</div></div>

<!-- FACILITIES (sand, square white cards like theirs) -->
<div class="band" style="background:var(--white)"><div class="wrap">
  <span class="script" data-i="scriptFac"></span>
  <h2 class="h2" data-i="facH"></h2>
  <div class="grid2" style="margin-top:1rem" id="fac"></div>
</div></div>

<!-- MEETINGS & EVENTS (aqua band, brown button like theirs) -->
<div class="band aqua"><div class="wrap">
  <span class="script" data-i="scriptEv"></span>
  <h2 class="h2" data-i="evH"></h2>
